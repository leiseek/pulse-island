[workspace]
members = [
  "crates/pulse-domain",
  "crates/pulse-protocol",
  "crates/pulse-testkit",
  "crates/pulse-reducer",
  "crates/pulse-routing",
  "crates/pulse-fuel",
  "crates/pulse-arbitration",
  "crates/pulse-island-ui",
  "crates/pulse-win32",
  "crates/pulse-win32-hwnd",
  "crates/pulse-win32-link",
  "crates/pulse-link-core",
  "crates/pulse-persistence",
  "apps/pulse-island-spike",
  "apps/pulse-link",
  "apps/pulse-link-shim",
  "apps/pulse-link-spike-client",
  "apps/pulse-island",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.78"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
